name: Python Application CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f 05_Project_Development/backend/requirements.txt ]; then pip install -r 05_Project_Development/backend/requirements.txt; fi
        
    - name: Syntax Check
      run: |
        python -m py_compile 05_Project_Development/backend/*.py
